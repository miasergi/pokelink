  <text x="2" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="6.5"
        fill="none" stroke="#08080A" stroke-width="5" stroke-linejoin="round" paint-order="stroke">LA DESPEDIDA</text>
  <text x="2" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="6.5"
        fill="#A1A1AA">LA DESPEDIDA</text>
