  <!-- Wordmark del evento. Impact/Arial Narrow imitan a Anton allí donde la
       fuente web no llega (la tarjeta del hub es una imagen suelta). -->
  <text x="0" y="52" font-family="Impact, 'Arial Narrow', 'Arial Black', sans-serif" font-size="52"
        letter-spacing="1" fill="none" stroke="#08080A" stroke-width="7" stroke-linejoin="round" paint-order="stroke">ÓSCAR<tspan fill="#08080A">26</tspan></text>
  <text x="0" y="52" font-family="Impact, 'Arial Narrow', 'Arial Black', sans-serif" font-size="52"
