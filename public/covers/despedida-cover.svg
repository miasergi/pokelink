<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12082a"/>
      <stop offset="0.5" stop-color="#3d0f3a"/>
      <stop offset="1" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rosa" cx="0.15" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="azul" cx="0.9" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="360" fill="url(#bg)"/>
  <rect width="720" height="360" fill="url(#rosa)"/>
  <rect width="720" height="360" fill="url(#azul)"/>

  <!-- Estrellas -->
  <g fill="#e2e8f0">
    <circle cx="70" cy="52" r="2" opacity="0.9"/>
    <circle cx="132" cy="96" r="1.4" opacity="0.6"/>
    <circle cx="215" cy="44" r="1.8" opacity="0.75"/>
    <circle cx="300" cy="86" r="1.2" opacity="0.5"/>
    <circle cx="612" cy="120" r="1.6" opacity="0.7"/>
    <circle cx="668" cy="58" r="2.2" opacity="0.85"/>
    <circle cx="540" cy="40" r="1.3" opacity="0.55"/>
    <circle cx="404" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="96" cy="176" r="1.3" opacity="0.5"/>
    <circle cx="655" cy="220" r="1.5" opacity="0.5"/>
  </g>

  <!-- Luna con halo: el símbolo de la despedida -->
  <circle cx="545" cy="150" r="130" fill="url(#halo)"/>
  <circle cx="545" cy="150" r="66" fill="url(#luna)"/>
  <g fill="#f59e0b" opacity="0.35">
    <circle cx="522" cy="130" r="13"/>
    <circle cx="568" cy="168" r="9"/>
    <circle cx="556" cy="118" r="6"/>
  </g>

  <!-- Mando de consola en silueta: lo que se va a hacer todo el día -->
  <g transform="translate(118 138) scale(0.86)" fill="none" stroke="#f472b6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M28 0h84c22 0 34 12 40 34l16 56c6 22-6 38-24 38-14 0-22-8-30-20l-10-16H32L22 108c-8 12-16 20-30 20-18 0-30-16-24-38l16-56C-10 12 6 0 28 0Z"/>
    <path d="M34 52h30M49 37v30" stroke="#fbbf24"/>
    <circle cx="112" cy="44" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="134" cy="62" r="7" fill="#4ade80" stroke="none"/>
  </g>

  <!-- Confeti -->
  <g opacity="0.85">
    <rect x="330" y="252" width="9" height="16" rx="2" fill="#38bdf8" transform="rotate(24 334 260)"/>
    <rect x="392" y="286" width="8" height="15" rx="2" fill="#fbbf24" transform="rotate(-32 396 293)"/>
    <rect x="452" y="248" width="9" height="16" rx="2" fill="#4ade80" transform="rotate(48 456 256)"/>
    <rect x="512" y="292" width="8" height="14" rx="2" fill="#f472b6" transform="rotate(-16 516 299)"/>
    <rect x="600" y="262" width="9" height="16" rx="2" fill="#a78bfa" transform="rotate(36 604 270)"/>
    <rect x="268" y="300" width="8" height="14" rx="2" fill="#f87171" transform="rotate(-44 272 307)"/>
  </g>

  <!-- Velo inferior para que el logo y el texto se lean -->
  <rect y="230" width="720" height="130" fill="#05070f" opacity="0.55"/>
</svg>
