<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <radialGradient id="resplandor" cx="0.5" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#D7FF3E" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#D7FF3E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rejilla" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#24242C" stroke-width="1"/>
    </pattern>
    <linearGradient id="desvanece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08080A" stop-opacity="0"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
  </defs>

  <rect width="720" height="360" fill="#08080A"/>
  <rect width="720" height="360" fill="url(#rejilla)" opacity="0.75"/>
  <rect width="720" height="360" fill="url(#resplandor)"/>

  <!-- Cinta diagonal de lima: la marca de la casa -->
  <g transform="rotate(-14 360 180)">
    <rect x="-60" y="150" width="840" height="30" fill="#D7FF3E"/>
    <text x="360" y="171" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="19"
          letter-spacing="7" fill="#08080A">12 · 13 SEPT 2026 · 12 · 13 SEPT 2026 · 12 · 13 SEPT 2026</text>
  </g>

  <!-- Filetes técnicos en las esquinas -->
  <g stroke="#D7FF3E" stroke-width="2" fill="none">
    <path d="M24 24h34M24 24v34"/>
    <path d="M696 336h-34M696 336v-34"/>
  </g>

  <!-- Marcas de tiempo, como un lineup -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#3F3F46" letter-spacing="2">
    <text x="24" y="76">10:00</text>
    <text x="24" y="96">11:00</text>
    <text x="24" y="116">12:30</text>
    <text x="640" y="76">21:00</text>
    <text x="640" y="96">23:00</text>
  </g>

  <!-- Velo inferior para que el logo y el texto de la tarjeta se lean -->
  <rect y="200" width="720" height="160" fill="url(#desvanece)"/>
</svg>
