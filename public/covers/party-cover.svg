<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1038"/>
      <stop offset="0.55" stop-color="#3b0f4f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cup2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" fill="url(#bg)"/>
  <rect width="720" height="360" fill="url(#glow1)"/>
  <rect width="720" height="360" fill="url(#glow2)"/>

  <!-- Bolas de luz de fondo (bokeh) -->
  <circle cx="90" cy="70" r="26" fill="#a78bfa" opacity="0.18"/>
  <circle cx="640" cy="60" r="34" fill="#f472b6" opacity="0.16"/>
  <circle cx="540" cy="120" r="16" fill="#38bdf8" opacity="0.22"/>
  <circle cx="160" cy="250" r="22" fill="#fbbf24" opacity="0.15"/>
  <circle cx="680" cy="230" r="18" fill="#4ade80" opacity="0.18"/>

  <!-- Vaso 1 (brindando, inclinado a la derecha) -->
  <g transform="translate(300 150) rotate(12)">
    <path d="M -38 0 L -28 120 Q -27 132 -14 132 L 14 132 Q 27 132 28 120 L 38 0 Z" fill="#e2e8f0" opacity="0.92"/>
    <path d="M -34 26 L -27 112 Q -26 122 -15 122 L 15 122 Q 26 122 27 112 L 34 26 Z" fill="url(#cup)"/>
    <ellipse cx="0" cy="0" rx="38" ry="7" fill="#f8fafc"/>
    <rect x="8" y="-58" width="5" height="64" rx="2.5" fill="#f472b6" transform="rotate(18)"/>
    <circle cx="30" cy="-52" r="9" fill="#fb7185"/>
  </g>

  <!-- Vaso 2 (brindando, inclinado a la izquierda) -->
  <g transform="translate(430 150) rotate(-12)">
    <path d="M -38 0 L -28 120 Q -27 132 -14 132 L 14 132 Q 27 132 28 120 L 38 0 Z" fill="#e2e8f0" opacity="0.92"/>
    <path d="M -34 26 L -27 112 Q -26 122 -15 122 L 15 122 Q 26 122 27 112 L 34 26 Z" fill="url(#cup2)"/>
    <ellipse cx="0" cy="0" rx="38" ry="7" fill="#f8fafc"/>
    <rect x="-14" y="-58" width="5" height="64" rx="2.5" fill="#38bdf8" transform="rotate(-18)"/>
  </g>

  <!-- Chispas del brindis -->
  <g fill="#fde68a">
    <path d="M 365 84 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path d="M 330 60 l 2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z" opacity="0.85"/>
    <path d="M 402 58 l 2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z" opacity="0.85"/>
  </g>

  <!-- Confeti -->
  <g>
    <rect x="120" y="120" width="10" height="4" rx="2" fill="#4ade80" transform="rotate(25 125 122)"/>
    <rect x="200" y="60" width="10" height="4" rx="2" fill="#38bdf8" transform="rotate(-40 205 62)"/>
    <rect x="560" y="200" width="10" height="4" rx="2" fill="#a78bfa" transform="rotate(60 565 202)"/>
    <rect x="620" y="130" width="10" height="4" rx="2" fill="#fbbf24" transform="rotate(-20 625 132)"/>
    <rect x="90" y="190" width="10" height="4" rx="2" fill="#f472b6" transform="rotate(45 95 192)"/>
    <rect x="500" y="70" width="10" height="4" rx="2" fill="#4ade80" transform="rotate(-65 505 72)"/>
    <circle cx="250" cy="100" r="4" fill="#f472b6"/>
    <circle cx="470" cy="240" r="4" fill="#38bdf8"/>
    <circle cx="150" cy="300" r="4" fill="#fbbf24"/>
    <circle cx="590" cy="300" r="4" fill="#a78bfa"/>
  </g>

  <!-- Dado y carta, guiños a los juegos -->
  <g transform="translate(120 255) rotate(-14)">
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#f8fafc"/>
    <circle cx="-11" cy="-11" r="5" fill="#0f172a"/>
    <circle cx="11" cy="-11" r="5" fill="#0f172a"/>
    <circle cx="0" cy="0" r="5" fill="#0f172a"/>
    <circle cx="-11" cy="11" r="5" fill="#0f172a"/>
    <circle cx="11" cy="11" r="5" fill="#0f172a"/>
  </g>
  <g transform="translate(610 268) rotate(16)">
    <rect x="-24" y="-33" width="48" height="66" rx="7" fill="#f8fafc"/>
    <text x="-16" y="-14" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#dc2626">K</text>
    <text x="-4" y="14" font-family="Georgia, serif" font-size="26" fill="#dc2626" text-anchor="middle">♥</text>
  </g>
</svg>
